<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 1248" width="1248" height="1248">
  <defs>
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43e8ff"/>
      <stop offset="1" stop-color="#18a6eb"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b548ff"/>
      <stop offset="1" stop-color="#8f39e2"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff56c9"/>
      <stop offset="1" stop-color="#f13caf"/>
    </linearGradient>
    <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e0d3"/>
      <stop offset="1" stop-color="#18d7de"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd135"/>
      <stop offset="1" stop-color="#ff9e28"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f92ff"/>
      <stop offset="1" stop-color="#2468e8"/>
    </linearGradient>
    <linearGradient id="gTray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8ff"/>
      <stop offset="0.55" stop-color="#cfe9fb"/>
      <stop offset="1" stop-color="#b7daf6"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fdff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7bbce6" flood-opacity="0.16"/>
    </filter>
  </defs>

