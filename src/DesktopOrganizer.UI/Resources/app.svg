        fill="url(#gRim)"/>

  <!-- six blocks -->
  <g filter="url(#soft)">
    <rect x="227" y="256" width="253" height="246" rx="66" fill="url(#gCyan)"/>
    <rect x="498" y="256" width="254" height="246" rx="66" fill="url(#gPurple)"/>
    <rect x="769" y="256" width="254" height="246" rx="66" fill="url(#gPink)"/>

    <rect x="227" y="518" width="253" height="247" rx="66" fill="url(#gMint)"/>
    <rect x="498" y="518" width="254" height="247" rx="66" fill="url(#gOrange)"/>
    <rect x="769" y="518" width="254" height="247" rx="66" fill="url(#gBlue)"/>
  </g>

